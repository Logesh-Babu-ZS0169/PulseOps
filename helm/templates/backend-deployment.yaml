apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "metrics-dashboard.fullname" . }}-backend
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "metrics-dashboard.labels" . | nindent 4 }}
    component: backend
spec:
  replicas: {{ .Values.replicaCount.backend }}
  selector:
    matchLabels:
      {{- include "metrics-dashboard.selectorLabels" . | nindent 6 }}
      component: backend
  template:
    metadata:
      labels:
        {{- include "metrics-dashboard.selectorLabels" . | nindent 8 }}
        component: backend
    spec:
      containers:
      - name: backend
        image: "{{ .Values.image.registry }}/{{ .Values.image.backend.repository }}:{{ .Values.image.backend.tag }}"
        imagePullPolicy: {{ .Values.image.backend.pullPolicy }}
        ports:
        - containerPort: {{ .Values.backend.service.port }}
          name: http
        env:
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:postgresql://{{ .Values.database.host }}:{{ .Values.database.port }}/{{ .Values.database.name }}"
        - name: SPRING_DATASOURCE_USERNAME
          value: "{{ .Values.database.username }}"
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "metrics-dashboard.fullname" . }}-secrets
              key: db-password
        - name: SPRING_MAIL_HOST
          value: "{{ .Values.email.host }}"
        - name: SPRING_MAIL_PORT
          value: "{{ .Values.email.port }}"
        - name: SPRING_MAIL_USERNAME
          valueFrom:
            secretKeyRef:
              name: {{ include "metrics-dashboard.fullname" . }}-secrets
              key: mail-username
        - name: SPRING_MAIL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "metrics-dashboard.fullname" . }}-secrets
              key: mail-password
        - name: MAIL_TO
          value: "{{ .Values.email.to }}"
        resources:
          {{- toYaml .Values.backend.resources | nindent 10 }}
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: http
          initialDelaySeconds: 60
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 5
