apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metrics-dashboard
  namespace: argocd
  labels:
    app: metrics-dashboard
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  
  source:
    repoURL: https://github.com/Logesh-Babu-ZS0169/Ingest-metrics.git
    targetRevision: enhancedev/mini-datadog-viewer
    path: k8s-new/k8s/overlays/production
  
  destination:
    server: https://kubernetes.default.svc
    namespace: bronze
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  
  revisionHistoryLimit: 10
  
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
