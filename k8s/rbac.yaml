apiVersion: v1
kind: ServiceAccount
metadata:
  name: metrics-dashboard-backend
  namespace: bronze
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: metrics-dashboard-viewer
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes", "namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: metrics-dashboard-viewer-binding
subjects:
  - kind: ServiceAccount
    name: metrics-dashboard-backend
    namespace: bronze
roleRef:
  kind: ClusterRole
  name: metrics-dashboard-viewer
  apiGroup: rbac.authorization.k8s.io
