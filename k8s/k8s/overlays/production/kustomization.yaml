apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: bronze

resources:
- ../../base

replicas:
- count: 1
  name: metrics-dashboard-backend
- count: 1
  name: metrics-dashboard-frontend

images:
- name: zsubscription/ingestionmetrics-backend
  newTag: 1.10.3
- name: zsubscription/ingestionmetrics-frontend
  newTag: 1.10.3

labels:
- pairs:
    environment: production
