version: '3.8'

services:
  backend:
    image: zsubscription/ingestionmetrics-backend:v1.3.0
    container_name: ingestionmetrics-backend
    ports:
      - "8181:8181"
    environment:
      # Database Configuration
      - SPRING_DATASOURCE_URL=jdbc:postgresql://intics-psql-server.postgres.database.azure.com:5432/intics_dev
      - SPRING_DATASOURCE_USERNAME=intics-psql

      # Email Configuration (SMTP)
      - SPRING_MAIL_HOST=smtp.gmail.com
      - SPRING_MAIL_PORT=587
      - SPRING_MAIL_USERNAME=inticsai@gmail.com
      - SPRING_MAIL_PASSWORD=qvpkyekqmsggsffo
      - MAIL_TO=logesh.b@zucisystems.com

      # Notification Settings
      - NOTIFICATION_EMAIL_FROM=inticsai@gmail.com
      - NOTIFICATION_EMAIL_TO=logesh.b@zucisystems.com

      # Scheduler Cron Expressions
      - SCHEDULER_CRON_COMMERCIAL=0 */15 * * * *
      - SCHEDULER_CRON_GBD=0 */15 * * * *

      # Server Configuration
      - SERVER_PORT=8181

      # HikariCP Connection Pool Settings
      - HIKARI_MAX_POOL_SIZE=10
      - HIKARI_MIN_IDLE=2
      - HIKARI_CONNECTION_TIMEOUT=30000
      - HIKARI_IDLE_TIMEOUT=300000
      - HIKARI_LEAK_DETECTION_THRESHOLD=60000
    networks:
      - metrics-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8181/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    image: zsubscription/ingestionmetrics-frontend:v1.3.0
    container_name: ingestionmetrics-frontend
    ports:
      - "5000:5000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8181
    depends_on:
      - backend
    networks:
      - metrics-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  metrics-network:
    driver: bridge
