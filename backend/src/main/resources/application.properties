azure.token.enabled=false

# Azure AD Configuration (only used when azure.token.enabled=true)


# Azure AD Configuration (only used when azure.token.enabled=true) add
azure.identity.tenantId=2f30df36-e5b3-4199-ae1e-c03c7409c3e4
azure.identity.clientId=ed93943a-ed6f-4de4-a8a3-880b851a07b1
azure.identity.clientSecret=${AZURE_CLIENT_SECRET}
azure.token.scope=https://ossrdbms-aad.database.windows.net/.default


